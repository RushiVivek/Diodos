name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build distributions
        run: uv build

      - name: Twine metadata check
        run: uvx twine check dist/*

  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv pip install --system .

      # Every module is imported so a platform-only dependency (such as the
      # Unix-only fcntl) fails here instead of at the user's first run.
      - name: Import every module
        run: |
          python -c "import pkgutil, importlib, diodos; [importlib.import_module(m.name) for m in pkgutil.walk_packages(diodos.__path__, 'diodos.')]"

      - name: Run the CLI
        run: |
          python -m diodos --version
          python -m diodos --help
          diodos --version

      - name: Exercise config, cookie jar and daemon control
        run: python tests/smoke_test.py
